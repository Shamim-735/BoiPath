name: Checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_USER: boipath
          POSTGRES_DB: boipath_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U boipath -d boipath_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s tests -v
        env:
          BOIPATH_TEST_DATABASE_URL: postgresql://boipath:ci-test-only@localhost:5432/boipath_test
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: python3 scripts/configure_flutter.py
      - run: flutter pub get
        working-directory: apps/flutter_app
      - run: flutter analyze lib test
        working-directory: apps/flutter_app
      - run: flutter test test/catalog_test.dart
        working-directory: apps/flutter_app
      - run: flutter build web --release --dart-define=API_BASE_URL=https://api.example.invalid
        working-directory: apps/flutter_app
