name: boipath
description: Independent textbook library and classroom reader for Bangladesh.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.6
  dio: ^5.9.0
  file_picker: ^10.3.3
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.0
  path_provider: ^2.1.5
  pdfrx: 2.4.5
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  qr_flutter: ^4.1.0
  web: ^1.1.1
  web_socket_channel: ^3.0.3
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/starter_catalog.json
